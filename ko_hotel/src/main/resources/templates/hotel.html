<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>궁금하면 500원 Hotel 챗봇</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .message {
            margin-bottom: 10px; /* 메시지 간 간격 조정 */
        }
        .content {
            white-space: pre-wrap; /* 줄바꿈 유지 */
            line-height: 1.2; /* 줄 간격을 1.4에서 1.2로 줄임 */
            padding: 5px 0; /* 위아래 패딩 유지 */
            margin: 0; /* 불필요한 여백 제거 */
            word-wrap: break-word; /* 긴 단어 자동 줄바꿈 */
        }
        .sender {
            font-weight: bold;
        }
        .text-primary { color: #007bff; }
        .text-success { color: #28a745; }
        .text-danger { color: #dc3545; }

        .chat-box {
            max-height: 500px;
            overflow-y: auto;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 15px;
            background-color: #f8f9fa;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .message .sender {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .message .content {
            white-space: pre-wrap;
            word-wrap: break-word;
            padding-left: 15px;
            border-left: 2px solid #ddd;
            background-color: #fff;
            padding: 8px;
            border-radius: 5px;
        }
        .hotel-info {
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center mb-4">궁금하면500원 Hotel AI 챗봇 서비스</h1>
    <p class="text-center">궁금하면500원 Hotel의 AI 챗봇은 고객의 질문에 답변하고 필요한 정보를 제공합니다.</p>

    <!-- Hotel Information -->
    <div class="hotel-info" th:if="${hotelInfo}">
        <h3 th:text="${hotelInfo.hotelName}">호텔 이름</h3>
        <ul>
            <li><strong>체크인 시간:</strong> <span th:text="${hotelInfo.checkIn}"></span></li>
            <li><strong>체크아웃 시간:</strong> <span th:text="${hotelInfo.checkOut}"></span></li>
            <li><strong>룸 서비스:</strong> <span th:text="${hotelInfo.roomService}"></span></li>
            <li><strong>주차장:</strong> <span th:text="${hotelInfo.parking}"></span></li>
            <li><strong>Wi-Fi:</strong> <span th:text="${hotelInfo.wifi}"></span></li>
            <li><strong>흡연 정책:</strong> <span th:text="${hotelInfo.smokingPolicy}"></span></li>
            <li><strong>반려동물 정책:</strong> <span th:text="${hotelInfo.petPolicy}"></span></li>
            <li><strong>편의시설:</strong>
                <ul th:each="facility : ${hotelInfo.facilities}">
                    <li th:text="${facility}"></li>
                </ul>
            </li>
        </ul>
    </div>

    <div class="chat-box mb-3" id="chatBox">
    </div>

    <!-- Chat Input -->
    <form id="chatForm" class="form-inline">
        <div class="form-group flex-fill">
            <input type="text" id="messageInput" class="form-control w-100" placeholder="질문을 입력하세요..." required>
        </div>
        <button type="submit" class="btn btn-primary ml-2">전송</button>
    </form>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const chatForm = document.getElementById('chatForm');
    const messageInput = document.getElementById('messageInput');

    chatForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        const userMessage = messageInput.value.trim();
        if (!userMessage) return;

        // Add user message to chat
        appendMessage('고객', userMessage);

        // Clear input field
        messageInput.value = '';

        try {
            const response = await fetch(`/question?question=${encodeURIComponent(userMessage)}`, {
                headers: {
                    'Accept': 'text/event-stream'
                }
            });
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }

            if (response.body && response.headers.get('Content-Type')?.includes('text/event-stream')) {
                const reader = response.body.getReader();
                let botMessageElement = appendMessage('챗봇', '');
                let contentElement = botMessageElement.querySelector('.content');
                await processStream(reader, contentElement);
            } else {
                const text = await response.text();
                let botMessageElement = appendMessage('챗봇', '');
                let contentElement = botMessageElement.querySelector('.content');
                contentElement.textContent = cleanData(text).trim();
            }
        } catch (error) {
            console.error('Error:', error);
            appendMessage('시스템', '오류가 발생했습니다. 다시 시도해 주세요.');
        }
    });

    function appendMessage(sender, content) {
        const messageElement = document.createElement('div');
        messageElement.className = 'message';
        messageElement.innerHTML = `
            <div class="sender ${sender === '고객' ? 'text-primary' : sender === '챗봇' ? 'text-success' : 'text-danger'}">${sender}:</div>
            <div class="content">${content || ''}</div>
        `;
        chatBox.appendChild(messageElement);
        chatBox.scrollTop = chatBox.scrollHeight;
        return messageElement;
    }

    async function processStream(reader, contentElement) {
        const decoder = new TextDecoder('utf-8');
        let fullContent = ''; // 전체 내용을 저장할 변수
        let buffer = ''; // 불완전한 데이터를 저장할 버퍼

        try {
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                console.log('Received raw chunk:', chunk);

                // 이전 버퍼와 새 청크를 합침
                buffer += chunk;

                // 전체 텍스트에서 모든 data: 접두사를 제거
                // 정규식을 사용하여 'data:' 뒤의 내용만 추출
                const cleanedContent = buffer.replace(/data:\s*/g, '');

                // [DONE]이나 기타 제어 신호 제거
                const finalContent = cleanedContent
                    .replace(/\[DONE\]/g, '')
                    .replace(/event:\s*\w+/g, '')
                    .replace(/id:\s*\w+/g, '')
                    .trim();

                console.log('Processed content:', finalContent);

                // 실제 콘텐츠만 있는 경우에만 업데이트
                if (finalContent && finalContent !== fullContent) {
                    fullContent = finalContent;
                    contentElement.textContent = fullContent;
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            }
        } catch (error) {
            console.error('Error processing stream:', error);
            contentElement.innerHTML += '<br><span class="text-danger">[스트리밍 오류]</span>';
        }
    }

    // data:를 포함한 텍스트를 정리하는 헬퍼 함수 (일반 응답용)
    function cleanData(text) {
        console.log('Raw text to clean:', text);

        // 정규식을 사용하여 모든 data: 접두사를 제거
        const cleaned = text
            .replace(/data:\s*/g, '') // 모든 'data:' 접두사 제거
            .replace(/\[DONE\]/g, '') // [DONE] 신호 제거
            .replace(/event:\s*\w+/g, '') // event: 라인 제거
            .replace(/id:\s*\w+/g, '') // id: 라인 제거
            .replace(/\n\s*\n/g, '\n') // 빈 줄 정리
            .trim();

        console.log('Cleaned text:', cleaned);
        return cleaned;
    }
</script>
<script src="https://code.jquery.com/jquery-3.7.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
</body>
</html>
