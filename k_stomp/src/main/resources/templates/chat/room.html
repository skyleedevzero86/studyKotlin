<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>채팅방</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/javascript" th:inline="javascript">
    const chatRoomId = /*[[${chatRoomId}]]*/ 0;
</script>

<script type="text/babel">
    const {useEffect, useRef, useState} = React;

    const socket = new SockJS('http://localhost:8081/ws');
    const stompClient = Stomp.over(socket);

    stompClient.debug = function(str) {
        console.log("STOMP Debug: ", str);
    };

    function App() {
        const lastChatMessageId = useRef(0);
        const [chatRoom, setChatRoom] = useState();
        const [chatMessages, setChatMessages] = useState([]);
        const [connected, setConnected] = useState(false);

        const loadMoreChatMessages = () => {
            fetch(`/api/v1/chat/rooms/${chatRoomId}/messages?afterChatMessageId=${lastChatMessageId.current}`)
                .then(res => res.json())
                .then(data => {
                    if (data.length > 0) {
                        data.reverse();
                        lastChatMessageId.current = data[0].id;
                        setChatMessages(prev => [...data, ...prev]);
                    }
                })
                .catch(err => console.error("Failed to load messages:", err));
        };

        useEffect(() => {
            // 채팅방 정보 불러오기
            fetch(`/api/v1/chat/rooms/${chatRoomId}`)
                .then(res => res.json())
                .then(setChatRoom)
                .catch(err => console.error("Failed to load chat room:", err));

            // 초기 메시지 불러오기
            loadMoreChatMessages();

            // 웹소켓 연결
            stompClient.connect({}, function (frame) {
                console.log("Connected to WebSocket: " + frame);
                setConnected(true);

                // 이 채팅방의 RabbitMQ 토픽 구독
                stompClient.subscribe(
                    `/topic/chat.rooms.${chatRoomId}.messages.created`,
                    function (message) {
                        console.log("Received message: ", message.body);
                        try {
                            const receivedMessage = JSON.parse(message.body);
                            setChatMessages(prev => [receivedMessage, ...prev]);
                        } catch (e) {
                            console.error("Failed to parse message:", e);
                        }
                    },
                    { id: `chat-subscription-${chatRoomId}` }
                );
            }, function(error) {
                console.error("STOMP connection error:", error);
                setConnected(false);
                // 일정 시간 후 재연결 시도
                setTimeout(() => {
                    window.location.reload();
                }, 5000);
            });

            // 컴포넌트 언마운트 시 정리
            return () => {
                if (stompClient && stompClient.connected) {
                    stompClient.disconnect();
                    console.log("Disconnected from WebSocket");
                }
            };
        }, []);

        const onChatMessageFormSubmit = (e) => {
            e.preventDefault();
            const form = e.target;

            const writerName = form.writerName.value.trim();
            const content = form.content.value.trim();

            if (!writerName) {
                alert("작성자를 입력해주세요.");
                form.writerName.focus();
                return;
            }

            if (!content) {
                alert("메세지를 입력해주세요.");
                form.content.focus();
                return;
            }

            if (!connected) {
                alert("서버와의 연결이 끊어졌습니다. 페이지를 새로고침해 주세요.");
                return;
            }

            const messageData = { writerName, content };
            console.log("Sending message:", messageData);

            // 올바른 목적지로 메시지 전송
            stompClient.send(
                `/app/chat/rooms/${chatRoomId}/messages/create`,
                {},
                JSON.stringify(messageData)
            );

            // 폼 초기화
            form.content.value = "";
            form.content.focus();
        };

        if (!chatRoom) return <div>로딩중...</div>;

        return (
            <div>
                <h1>채팅방(No {chatRoom.id} : {chatRoom.name})</h1>
                <div>개설날짜 : {dateForPrint(chatRoom.createDate)}</div>
                <div>연결 상태: {connected ? '연결됨' : '연결 안됨'}</div>
                <hr/>
                <h2>채팅 메세지 작성</h2>
                <form onSubmit={onChatMessageFormSubmit}>
                    <input name="writerName" placeholder="작성자" autoComplete="off"/>
                    <input name="content" placeholder="메세지" autoComplete="off"/>
                    <input type="submit" value="작성"/>
                </form>
                <hr/>
                <h2>채팅 메세지</h2>
                <ul>
                    {chatMessages.map(msg => (
                        <li key={msg.id}>
                            {msg.id}({dateForPrint(msg.createDate)}) : {msg.writerName} : {msg.content}
                        </li>
                    ))}
                </ul>
            </div>
        );
    }

    function dateForPrint(date) {
        if (Array.isArray(date)) {
            const d = new Date(...date);
            return d.toISOString().substring(2, 16).replaceAll("-", ".").replace("T", " ");
        }

        if (typeof date === 'string') {
            return date.substring(2, 16).replaceAll("-", ".").replace("T", " ");
        }

        return "";
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
