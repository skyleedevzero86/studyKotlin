<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1:1 화상통화</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            animation: fadeIn 0.8s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 1rem;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        h1 {
            color: #333;
            margin-bottom: 0.5rem;
            font-size: 2.2rem;
        }
        .subtitle {
            color: #666;
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
        }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 500;
            min-width: 160px;
        }
        .btn:hover {
            background: #5a6fd8;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        .btn-secondary {
            background: #28a745;
        }
        .btn-secondary:hover {
            background: #218838;
            box-shadow: 0 10px 25px rgba(40, 167, 69, 0.4);
        }
        .btn-icon {
            margin-right: 8px;
            font-size: 1.2rem;
        }
        .features {
            margin-top: 2rem;
            text-align: left;
            background: rgba(102, 126, 234, 0.1);
            padding: 20px;
            border-radius: 15px;
        }
        .feature-item {
            margin: 10px 0;
            color: #555;
            font-size: 0.95rem;
        }
        .feature-item::before {
            content: '✓';
            color: #28a745;
            font-weight: bold;
            margin-right: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo"></div>
    <h1>1:1 화상통화</h1>
    <p class="subtitle">간편하고 안전한 실시간 화상통화 서비스</p>

    <div>
        <a href="/create-room" class="btn">
            <span class="btn-icon"></span>새 방 만들기
        </a>
        <a href="/join" class="btn btn-secondary">
            <span class="btn-icon"></span>방 참가하기
        </a>
    </div>

    <div class="features">
        <div class="feature-item">무료 1:1 화상통화</div>
        <div class="feature-item">실시간 오디오/비디오 통화</div>
        <div class="feature-item">화면 공유 지원</div>
        <div class="feature-item">안전한 P2P 연결</div>
    </div>
</div>

<script>
    // 페이지 로드 애니메이션
    window.addEventListener('load', function() {
        console.log('1:1 화상통화 서비스에 오신 것을 환영합니다!');

        // 브라우저 호환성 체크
        checkBrowserCompatibility();
    });

    // 브라우저 호환성 체크
    function checkBrowserCompatibility() {
        const isWebRTCSupported = !!(
            navigator.mediaDevices &&
            navigator.mediaDevices.getUserMedia &&
            window.RTCPeerConnection
        );

        if (!isWebRTCSupported) {
            showCompatibilityWarning();
        }
    }

    // 호환성 경고 표시
    function showCompatibilityWarning() {
        const warning = document.createElement('div');
        warning.style.cssText = `
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffc107;
            color: #333;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.9rem;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        `;
        warning.innerHTML = '이 브라우저는 화상통화를 지원하지 않을 수 있습니다. Chrome, Firefox, Safari 최신 버전을 권장합니다.';

        document.body.appendChild(warning);

        setTimeout(() => warning.remove(), 5000);
    }

    // 키보드 단축키
    document.addEventListener('keydown', function(e) {
        if (e.key === '1' || e.key === 'c') {
            window.location.href = '/create-room';
        } else if (e.key === '2' || e.key === 'j') {
            window.location.href = '/join';
        }
    });

    // 페이지 가시성 API
    document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
            console.log('페이지가 다시 활성화되었습니다');
        }
    });
</script>
</body>
</html>
