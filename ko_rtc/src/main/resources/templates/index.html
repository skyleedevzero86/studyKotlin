<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${roomName} + ' - 화상통화'">화상통화</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: white;
            overflow: hidden;
        }
        .video-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
        }
        .main-video {
            flex: 1;
            position: relative;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .remote-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #2a2a2a;
        }
        .local-video-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #667eea;
            z-index: 10;
        }
        .local-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }
        .control-btn:hover {
            transform: scale(1.1);
        }
        .btn-video {
            background: #667eea;
            color: white;
        }
        .btn-audio {
            background: #28a745;
            color: white;
        }
        .btn-end {
            background: #dc3545;
            color: white;
        }
        .btn-video.off {
            background: #6c757d;
        }
        .btn-audio.off {
            background: #6c757d;
        }
        .room-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px 15px;
            border-radius: 10px;
            z-index: 10;
        }
        .status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 5;
        }
        .status h2 {
            margin-bottom: 1rem;
            color: #667eea;
        }
        .spinner {
            border: 4px solid #333;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="video-container">
    <div class="room-info">
        <div><strong th:text="${roomName}">방 이름</strong></div>
        <div>사용자: <span th:text="${userName}">사용자명</span></div>
        <div id="connectionStatus">연결 중...</div>
    </div>

    <div class="main-video">
        <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
        <div class="status" id="statusMessage">
            <div class="spinner"></div>
            <h2>상대방을 기다리는 중...</h2>
            <p>방 ID를 공유하여 상대방을 초대하세요</p>
            <p><strong th:text="${roomId}">방 ID</strong></p>
        </div>
    </div>

    <div class="local-video-container">
        <video id="localVideo" class="local-video" autoplay muted playsinline></video>
    </div>

    <div class="controls">
        <button id="videoBtn" class="control-btn btn-video" title="비디오 토글">📹</button>
        <button id="audioBtn" class="control-btn btn-audio" title="오디오 토글">🎤</button>
        <button id="endBtn" class="control-btn btn-end" title="통화 종료">📞</button>
    </div>
</div>

<script th:inline="javascript">
    const roomId = /*[[${roomId}]]*/ '';
    const userId = /*[[${userId}]]*/ '';
    const userName = /*[[${userName}]]*/ '';

    let localStream = null;
    let remoteStream = null;
    let peerConnection = null;
    let websocket = null;
    let isVideoEnabled = true;
    let isAudioEnabled = true;

    const configuration = {
        iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
        ]
    };

    // DOM 요소들
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const videoBtn = document.getElementById('videoBtn');
    const audioBtn = document.getElementById('audioBtn');
    const endBtn = document.getElementById('endBtn');
    const statusMessage = document.getElementById('statusMessage');
    const connectionStatus = document.getElementById('connectionStatus');

    // 초기화
    async function init() {
        try {
            // 로컬 미디어 스트림 획득
            localStream = await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: true
            });
            localVideo.srcObject = localStream;

            // WebSocket 연결
            connectWebSocket();

            // 컨트롤 버튼 이벤트 리스너
            setupControlButtons();

        } catch (error) {
            console.error('미디어 스트림 획득 실패:', error);
            statusMessage.innerHTML = '<h2>카메라/마이크 접근 실패</h2><p>브라우저에서 카메라와 마이크 권한을 허용해주세요.</p>';
        }
    }

    function connectWebSocket() {
        const wsUrl = `ws://localhost:8080/ws/signaling?roomId=${roomId}`;
        websocket = new WebSocket(wsUrl);

        websocket.onopen = () => {
            console.log('WebSocket 연결됨');
            connectionStatus.textContent = '연결됨';

            // 방 참가 메시지 전송
            sendMessage({
                type: 'JOIN_ROOM',
                roomId: roomId,
                fromUserId: userId
            });
        };

        websocket.onmessage = async (event) => {
            const message = JSON.parse(event.data);
            await handleSignalingMessage(message);
        };

        websocket.onclose = () => {
            console.log('WebSocket 연결 종료');
            connectionStatus.textContent = '연결 끊김';
        };

        websocket.onerror = (error) => {
            console.error('WebSocket 오류:', error);
            connectionStatus.textContent = '연결 오류';
        };
    }

    async function handleSignalingMessage(message) {
        console.log('시그널링 메시지 수신:', message);

        switch (message.type) {
            case 'USER_JOINED':
                if (message.fromUserId !== userId) {
                    statusMessage.innerHTML = '<h2>상대방이 참가했습니다</h2><p>연결을 설정하는 중...</p>';
                    await createPeerConnection();
                    await createOffer();
                }
                break;

            case 'OFFER':
                if (message.toUserId === userId || !message.toUserId) {
                    await handleOffer(message.data);
                }
                break;

            case 'ANSWER':
                if (message.toUserId === userId || !message.toUserId) {
                    await handleAnswer(message.data);
                }
                break;

            case 'ICE_CANDIDATE':
                if (message.toUserId === userId || !message.toUserId) {
                    await handleIceCandidate(message.data);
                }
                break;

            case 'USER_LEFT':
                if (message.fromUserId !== userId) {
                    handleUserLeft();
                }
                break;
        }
    }

    async function createPeerConnection() {
        peerConnection = new RTCPeerConnection(configuration);

        // 로컬 스트림 추가
        localStream.getTracks().forEach(track => {
            peerConnection.addTrack(track, localStream);
        });

        // 원격 스트림 처리
        peerConnection.ontrack = (event) => {
            console.log('원격 스트림 수신');
            remoteStream = event.streams[0];
            remoteVideo.srcObject = remoteStream;
            statusMessage.style.display = 'none';
        };

        // ICE 후보 처리
        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                sendMessage({
                    type: 'ICE_CANDIDATE',
                    roomId: roomId,
                    fromUserId: userId,
                    data: event.candidate
                });
            }
        };

        // 연결 상태 모니터링
        peerConnection.onconnectionstatechange = () => {
            console.log('연결 상태:', peerConnection.connectionState);
            connectionStatus.textContent = `연결 상태: ${peerConnection.connectionState}`;

            if (peerConnection.connectionState === 'connected') {
                statusMessage.style.display = 'none';
            } else if (peerConnection.connectionState === 'disconnected' ||
                peerConnection.connectionState === 'failed') {
                handleUserLeft();
            }
        };
    }

    async function createOffer() {
        try {
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            sendMessage({
                type: 'OFFER',
                roomId: roomId,
                fromUserId: userId,
                data: offer
            });
        } catch (error) {
            console.error('Offer 생성 실패:', error);
        }
    }

    async function handleOffer(offer) {
        try {
            if (!peerConnection) {
                await createPeerConnection();
            }

            await peerConnection.setRemoteDescription(offer);
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            sendMessage({
                type: 'ANSWER',
                roomId: roomId,
                fromUserId: userId,
                data: answer
            });
        } catch (error) {
            console.error('Offer 처리 실패:', error);
        }
    }

    async function handleAnswer(answer) {
        try {
            await peerConnection.setRemoteDescription(answer);
        } catch (error) {
            console.error('Answer 처리 실패:', error);
        }
    }

    async function handleIceCandidate(candidate) {
        try {
            if (peerConnection) {
                await peerConnection.addIceCandidate(candidate);
            }
        } catch (error) {
            console.error('ICE 후보 추가 실패:', error);
        }
    }

    function handleUserLeft() {
        statusMessage.style.display = 'block';
        statusMessage.innerHTML = '<h2>상대방이 나갔습니다</h2><p>새로운 참가자를 기다리는 중...</p>';

        if (remoteVideo.srcObject) {
            remoteVideo.srcObject = null;
        }

        if (peerConnection) {
            peerConnection.close();
            peerConnection = null;
        }
    }

    function setupControlButtons() {
        videoBtn.addEventListener('click', toggleVideo);
        audioBtn.addEventListener('click', toggleAudio);
        endBtn.addEventListener('click', endCall);
    }

    function toggleVideo() {
        isVideoEnabled = !isVideoEnabled;
        const videoTrack = localStream.getVideoTracks()[0];

        if (videoTrack) {
            videoTrack.enabled = isVideoEnabled;
            videoBtn.classList.toggle('off', !isVideoEnabled);
            videoBtn.textContent = isVideoEnabled ? '📹' : '📷';
        }
    }

    function toggleAudio() {
        isAudioEnabled = !isAudioEnabled;
        const audioTrack = localStream.getAudioTracks()[0];

        if (audioTrack) {
            audioTrack.enabled = isAudioEnabled;
            audioBtn.classList.toggle('off', !isAudioEnabled);
            audioBtn.textContent = isAudioEnabled ? '🎤' : '🎙️';
        }
    }

    function endCall() {
        if (confirm('통화를 종료하시겠습니까?')) {
            // 통화 종료 메시지 전송
            sendMessage({
                type: 'LEAVE_ROOM',
                roomId: roomId,
                fromUserId: userId
            });

            // 리소스 정리
            cleanup();

            // 메인 페이지로 이동
            window.location.href = '/';
        }
    }

    function cleanup() {
        if (localStream) {
            localStream.getTracks().forEach(track => track.stop());
        }

        if (peerConnection) {
            peerConnection.close();
        }

        if (websocket) {
            websocket.close();
        }
    }

    function sendMessage(message) {
        if (websocket && websocket.readyState === WebSocket.OPEN) {
            websocket.send(JSON.stringify(message));
        }
    }

    // 페이지 언로드 시 정리
    window.addEventListener('beforeunload', () => {
        cleanup();
    });

    // 페이지 로드 시 초기화
    window.addEventListener('load', init);
</script>
</body>
</html>
