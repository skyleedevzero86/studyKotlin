server:
  port: 8080
  address: 0.0.0.0

spring:
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML
  webflux:
    base-path: /
    websocket:
      max-frame-payload-length: 65536
  application:
    name: ko_rtc

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  r2dbc:
    url: r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""

  sql:
    init:
      mode: always

logging:
  level:
    com.sleekydz86.videocall: DEBUG
    org.springframework.web: DEBUG
    reactor.netty: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

info:
  app:
    name: WebRTC Video Call
    description: "1:1 Video calling application using WebRTC"
    version: 1.0.0
