server:
  port: 8080
  address: 0.0.0.0

spring:
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML
  webflux:
    base-path: /
    websocket:
      max-frame-payload-length: 65536
  application:
    name: ko_rtc

  r2dbc:
    url: r2dbc:h2:mem:///testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""

  h2:
    console:
      enabled: true

logging:
  level:
    com.example.videocall: DEBUG
    org.springframework.web.reactive.socket: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

info:
  app:
    name: WebRTC Video Call
    description: "1:1 Video calling application using WebRTC"
    version: 1.0.0
