version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: kominioai_bulletin
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  bulletin-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USERNAME: postgres
      DB_PASSWORD: password
      DATABASE_URL: jdbc:postgresql://postgres:5432/kominioai_bulletin
    depends_on:
      - postgres

volumes:
  postgres_data:
