spring:
  r2dbc:
    url: ${DATABASE_URL:r2dbc:postgresql://localhost:5432/kominioai_bulletin}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    pool:
      initial-size: 10
      max-size: 50
      max-idle-time: 60m
      max-acquire-time: 60s
      max-create-connection-time: 60s

  flyway:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kominioai_bulletin}
    user: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}

logging:
  level:
    root: WARN
    com.kominioai.domain.bulletin: INFO
    org.springframework.r2dbc: WARN
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

bulletin:
  config:
    debug: false
    mock-data: false
    cache:
      post-ttl: 600s
      comment-ttl: 600s
