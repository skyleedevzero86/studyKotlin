<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KominioAI - 게시판</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/bulletin.css" />
  </head>
  <body>
    <!-- 네비게이션 -->
    <nav class="navbar">
      <div class="nav-brand">
        <h1>KominioAI</h1>
      </div>
      <div class="nav-menu">
        <a href="#" class="nav-link" onclick="showSection('home')">홈</a>
        <a href="#" class="nav-link" onclick="showSection('surveys')"
          >설문조사</a
        >
        <a href="#" class="nav-link" onclick="showSection('quizzes')">퀴즈</a>
        <a href="#" class="nav-link active" onclick="showSection('bulletin')"
          >게시판</a
        >
        <a href="#" class="nav-link" onclick="showSection('profile')">프로필</a>
      </div>
      <div class="nav-actions">
        <button class="btn btn-outline" onclick="showLoginModal()">
          로그인
        </button>
        <button class="btn btn-primary" onclick="showRegisterModal()">
          회원가입
        </button>
      </div>
    </nav>

    <!-- 메인 컨텐츠 -->
    <main class="main-content">
      <!-- 게시판 섹션 -->
      <section id="bulletin-section" class="content-section">
        <div class="section-header">
          <h2>게시판</h2>
          <div class="section-actions">
            <button class="btn btn-primary" onclick="showCreatePostModal()">
              글쓰기
            </button>
          </div>
        </div>

        <!-- 게시판 탭 -->
        <div class="bulletin-tabs">
          <button
            class="tab-btn active"
            onclick="showBulletinTab('announcement')"
          >
            공지사항
          </button>
          <button class="tab-btn" onclick="showBulletinTab('community')">
            커뮤니티
          </button>
          <button class="tab-btn" onclick="showBulletinTab('qna')">Q&A</button>
        </div>

        <!-- 게시판 필터 -->
        <div class="bulletin-filters">
          <select id="bulletin-category" onchange="filterBulletinPosts()">
            <option value="">전체</option>
            <option value="announcement">공지사항</option>
            <option value="community">커뮤니티</option>
            <option value="qna">Q&A</option>
          </select>
          <input
            type="text"
            id="bulletin-search"
            placeholder="제목 검색..."
            onkeyup="searchBulletinPosts()"
          />
          <button class="btn btn-outline" onclick="resetBulletinFilters()">
            초기화
          </button>
        </div>

        <!-- 게시글 목록 -->
        <div class="bulletin-list" id="bulletin-list">
          <!-- 게시글들이 여기에 동적으로 로드됩니다 -->
        </div>

        <!-- 페이지네이션 -->
        <div class="pagination" id="bulletin-pagination">
          <!-- 페이지네이션이 여기에 동적으로 로드됩니다 -->
        </div>
      </section>

      <!-- 게시글 상세 -->
      <section
        id="post-detail-section"
        class="content-section"
        style="display: none"
      >
        <div class="post-detail-header">
          <button class="btn btn-outline" onclick="showSection('bulletin')">
            ← 목록으로
          </button>
          <div class="post-actions">
            <button class="btn btn-outline" onclick="editPost()">수정</button>
            <button class="btn btn-danger" onclick="deletePost()">삭제</button>
          </div>
        </div>
        <div class="post-detail-content" id="post-detail-content">
          <!-- 게시글 상세 내용이 여기에 로드됩니다 -->
        </div>
      </section>
    </main>

    <!-- 로그인 모달 -->
    <div id="login-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>로그인</h3>
          <button class="close-btn" onclick="closeModal('login-modal')">
            &times;
          </button>
        </div>
        <div class="modal-body">
          <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
              <label for="login-email">이메일</label>
              <input type="email" id="login-email" name="email" required />
            </div>
            <div class="form-group">
              <label for="login-password">비밀번호</label>
              <input
                type="password"
                id="login-password"
                name="password"
                required
              />
            </div>
            <div class="form-actions">
              <button
                type="button"
                class="btn btn-outline"
                onclick="closeModal('login-modal')"
              >
                취소
              </button>
              <button type="submit" class="btn btn-primary">로그인</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- 회원가입 모달 -->
    <div id="register-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>회원가입</h3>
          <button class="close-btn" onclick="closeModal('register-modal')">
            &times;
          </button>
        </div>
        <div class="modal-body">
          <form id="register-form" onsubmit="handleRegister(event)">
            <div class="form-group">
              <label for="register-email">이메일</label>
              <input type="email" id="register-email" name="email" required />
            </div>
            <div class="form-group">
              <label for="register-password">비밀번호</label>
              <input
                type="password"
                id="register-password"
                name="password"
                required
              />
            </div>
            <div class="form-group">
              <label for="register-firstName">이름</label>
              <input
                type="text"
                id="register-firstName"
                name="firstName"
                required
              />
            </div>
            <div class="form-group">
              <label for="register-lastName">성</label>
              <input
                type="text"
                id="register-lastName"
                name="lastName"
                required
              />
            </div>
            <div class="form-actions">
              <button
                type="button"
                class="btn btn-outline"
                onclick="closeModal('register-modal')"
              >
                취소
              </button>
              <button type="submit" class="btn btn-primary">회원가입</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- 글쓰기 모달 -->
    <div id="create-post-modal" class="modal">
      <div class="modal-content large">
        <div class="modal-header">
          <h3>글쓰기</h3>
          <button class="close-btn" onclick="closeModal('create-post-modal')">
            &times;
          </button>
        </div>
        <div class="modal-body">
          <form id="create-post-form" onsubmit="handleCreatePost(event)">
            <div class="form-group">
              <label for="post-category">카테고리</label>
              <select id="post-category" name="category" required>
                <option value="announcement">공지사항</option>
                <option value="community">커뮤니티</option>
                <option value="qna">Q&A</option>
              </select>
            </div>
            <div class="form-group">
              <label for="post-title">제목</label>
              <input type="text" id="post-title" name="title" required />
            </div>
            <div class="form-group">
              <label for="post-content">내용</label>
              <textarea
                id="post-content"
                name="content"
                rows="10"
                required
              ></textarea>
            </div>
            <div
              class="form-group"
              id="announcement-options"
              style="display: none"
            >
              <label class="checkbox-label">
                <input type="checkbox" id="post-pinned" name="pinned" />
                <span class="checkmark"></span>
                상단 고정
              </label>
            </div>
            <div class="form-actions">
              <button
                type="button"
                class="btn btn-outline"
                onclick="closeModal('create-post-modal')"
              >
                취소
              </button>
              <button type="submit" class="btn btn-primary">글쓰기</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- 댓글 작성 모달 -->
    <div id="create-comment-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>댓글 작성</h3>
          <button
            class="close-btn"
            onclick="closeModal('create-comment-modal')"
          >
            &times;
          </button>
        </div>
        <div class="modal-body">
          <form id="create-comment-form" onsubmit="handleCreateComment(event)">
            <input type="hidden" id="comment-post-id" name="postId" />
            <input type="hidden" id="comment-parent-id" name="parentId" />
            <div class="form-group">
              <label for="comment-content">댓글 내용</label>
              <textarea
                id="comment-content"
                name="content"
                rows="4"
                required
              ></textarea>
            </div>
            <div class="form-actions">
              <button
                type="button"
                class="btn btn-outline"
                onclick="closeModal('create-comment-modal')"
              >
                취소
              </button>
              <button type="submit" class="btn btn-primary">댓글 작성</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- 토스트 알림 -->
    <div id="toast" class="toast"></div>

    <!-- 로딩 오버레이 -->
    <div id="loading-overlay" class="loading-overlay">
      <div class="loading-spinner"></div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/bulletin.js"></script>
    <script src="js/api.js"></script>
  </body>
</html>
