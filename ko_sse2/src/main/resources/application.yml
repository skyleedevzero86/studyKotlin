spring:
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false  # 개발 중에는 false
  data:
    redis:
      host: 127.0.0.1
      port: 9379
      password: 123456
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
      stream:
        poll-timeout: 1000ms
        batch-size: 100
      listener:
        pool-size: 10
        max-connections: 50
      cluster:
        nodes:
          - 127.0.0.1:9379
        max-redirects: 3
  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true

  web:
    resources:
      static-locations: classpath:/templates/,classpath:/static/
      cache-period: 0

  ai:
    vectorstore:
      redis:
        initialize-schema: true
        index-name: lee-vectorstore
        prefix: "lee:"

    openai:
      api-key: ${서비스 키}
      chat:
        model: gpt-3.5-turbo
        temperature: 0.7
        max-tokens: 1000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  autoconfigure:
    exclude:
      - org.springframework.cloud.function.context.config.ContextFunctionCatalogAutoConfiguration
      - org.springframework.cloud.function.context.config.ContextFunctionCatalogAutoConfiguration$PlainFunctionScanConfiguration

logging:
  level:
    com.sleekydz86: DEBUG
    org.springframework.ai: DEBUG
    root: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

server:
  port: 8080

sse:
  redis:
    streams:
      enabled: true
      retention: 24h
      max-length: 10000
    pubsub:
      enabled: true
      channels:
        - "sse:user:*"
        - "sse:broadcast"
        - "sse:system"
    monitoring:
      enabled: true
      health-check-interval: 30s
      metrics-interval: 60s