<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <title th:text="'게시판'">게시판</title>
</head>
<body>
<div th:fragment="content">
  <h2>게시판</h2>
  <!-- 검색 폼 -->
  <form th:action="@{/posts/search}" method="get" class="mb-4">
    <div class="input-group">
      <select name="searchType" class="form-select">
        <option value="all">전체</option>
        <option value="title">제목</option>
        <option value="content">내용</option>
        <option value="author">작성자</option>
      </select>
      <input type="text" name="keyword" class="form-control" placeholder="검색어 입력">
      <button type="submit" class="btn btn-primary">검색</button>
    </div>
  </form>

  <!-- 게시글 목록 -->
  <table class="table table-striped">
    <thead>
    <tr>
      <th>제목</th>
      <th>작성자</th>
      <th>공지 유형</th>
      <th>작성일</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="post : ${posts}">
      <!-- 로그인한 사용자의 게시물만 표시하거나, 공개 게시물 및 관리자 게시물 표시 -->
      <td th:if="${post.isPrivate} ? (${currentUser != null} and (${currentUser.id == post.authorId} or ${currentUser.role == 'ROLE_ADMIN'})) : true">
        <a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}"></a>
        <span th:if="${post.isPrivate}" class="badge bg-secondary">비공개</span>
      </td>
      <td th:if="${post.isPrivate} ? (${currentUser != null} and (${currentUser.id == post.authorId} or ${currentUser.role == 'ROLE_ADMIN'})) : true"
          th:text="${post.authorUsername}"></td>
      <td th:if="${post.isPrivate} ? (${currentUser != null} and (${currentUser.id == post.authorId} or ${currentUser.role == 'ROLE_ADMIN'})) : true"
          th:text="${post.noticeType}"></td>
      <td th:if="${post.isPrivate} ? (${currentUser != null} and (${currentUser.id == post.authorId} or ${currentUser.role == 'ROLE_ADMIN'})) : true"
          th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
    </tr>
    <tr th:if="${posts.isEmpty}">
      <td colspan="4" class="text-center">게시글이 없습니다.</td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
