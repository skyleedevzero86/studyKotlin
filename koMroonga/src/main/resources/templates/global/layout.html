<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${title} ?: 'Komroonga'">Komroonga</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.2/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!-- 내비게이션 바 -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">Komroonga</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/posts}">게시판</a>
                </li>
                <!-- 로그인 후에만 보이는 메뉴 -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/posts/create}">글쓰기</a>
                </li>
                <!-- 회원 전용 메뉴 -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/posts/notices/member}">회원 공지</a>
                </li>
                <!-- 관리자 전용 메뉴 -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/members/search}">회원 관리</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <!-- 로그인하지 않은 경우 -->
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/login}">로그인</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/members/register}">회원가입</a>
                </li>
                <!-- 로그인한 경우 -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                        <span class="nav-link">
                            환영합니다, <span th:text="${#authentication.principal.name}"></span>님
                        </span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/members/myinfo}">내 정보</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" href="#" onclick="logout()">로그아웃</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- 콘텐츠 영역 -->
<div class="container mt-4">
    <div th:replace="~{${content} :: content}"></div>
</div>

<!-- 로그아웃 폼 -->
<form id="logoutForm" th:action="@{/logout}" method="post" style="display: none;">
    <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
</form>

<!-- 스크립트 -->
<script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
<script th:src="@{/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js}"></script>
<script th:inline="javascript">
    function logout() {
        document.getElementById('logoutForm').submit();
    }
</script>
</body>
</html>
