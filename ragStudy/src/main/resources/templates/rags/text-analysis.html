<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>텍스트 분석 서비스</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <style>
        .analysis-container {
            margin-top: 50px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .nav-tabs .nav-link {
            color: #495057;
        }
        .nav-tabs .nav-link.active {
            font-weight: bold;
            color: #0d6efd;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        #loadingSpinner {
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="analysis-container bg-light">
        <h1 class="mb-4 text-center">텍스트 분석 서비스</h1>

        <ul class="nav nav-tabs mb-4" id="analysisTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="similarity-tab" data-bs-toggle="tab" data-bs-target="#similarity" type="button" role="tab">텍스트 유사도</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="keywords-tab" data-bs-toggle="tab" data-bs-target="#keywords" type="button" role="tab">키워드 추출</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="sentiment-tab" data-bs-toggle="tab" data-bs-target="#sentiment" type="button" role="tab">감정 분석</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="cluster-tab" data-bs-toggle="tab" data-bs-target="#cluster" type="button" role="tab">문서 군집화</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="summarize-tab" data-bs-toggle="tab" data-bs-target="#summarize" type="button" role="tab">텍스트 요약</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="topic-tab" data-bs-toggle="tab" data-bs-target="#topic" type="button" role="tab">주제 분류</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tokenize-tab" data-bs-toggle="tab" data-bs-target="#tokenize" type="button" role="tab">텍스트 토큰화</button>
            </li>
        </ul>

        <div class="tab-content" id="analysisTabContent">
            <!-- 유사도 분석 -->
            <div class="tab-pane fade show active" id="similarity" role="tabpanel">
                <form id="similarityForm">
                    <div class="form-group">
                        <label for="text1" class="form-label">텍스트 1</label>
                        <textarea class="form-control" id="text1" name="text1" rows="5" placeholder="첫 번째 텍스트를 입력하세요" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="text2" class="form-label">텍스트 2</label>
                        <textarea class="form-control" id="text2" name="text2" rows="5" placeholder="두 번째 텍스트를 입력하세요" required></textarea>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary px-4">유사도 분석</button>
                    </div>
                </form>
            </div>

            <!-- 키워드 추출 -->
            <div class="tab-pane fade" id="keywords" role="tabpanel">
                <form id="keywordsForm">
                    <div class="form-group">
                        <label for="keywordsText" class="form-label">텍스트</label>
                        <textarea class="form-control" id="keywordsText" name="text" rows="8" placeholder="키워드를 추출할 텍스트를 입력하세요" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="keywordLimit" class="form-label">키워드 수</label>
                        <input type="number" class="form-control" id="keywordLimit" name="limit" min="1" max="20" value="5">
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary px-4">키워드 추출</button>
                    </div>
                </form>
            </div>

            <!-- 감정 분석 -->
            <div class="tab-pane fade" id="sentiment" role="tabpanel">
                <form id="sentimentForm">
                    <div class="form-group">
                        <label for="sentimentText" class="form-label">텍스트</label>
                        <textarea class="form-control" id="sentimentText" name="text" rows="8" placeholder="감정 분석할 텍스트를 입력하세요" required></textarea>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary px-4">감정 분석</button>
                    </div>
                </form>
            </div>

            <!-- 문서 군집화 -->
            <div class="tab-pane fade" id="cluster" role="tabpanel">
                <form id="clusterForm">
                    <div class="form-group">
                        <label class="form-label">문서 입력</label>
                        <div id="documentInputs">
                            <div class="mb-3">
                                <textarea class="form-control document-input" rows="3" placeholder="문서 1" required></textarea>
                            </div>
                            <div class="mb-3">
                                <textarea class="form-control document-input" rows="3" placeholder="문서 2" required></textarea>
                            </div>
                            <div class="mb-3">
                                <textarea class="form-control document-input" rows="3" placeholder="문서 3" required></textarea>
                            </div>
                        </div>
                        <div class="text-center mb-3">
                            <button type="button" id="addDocumentBtn" class="btn btn-secondary">문서 추가</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="clusterCount" class="form-label">군집 수 (K)</label>
                        <input type="number" class="form-control" id="clusterCount" name="k" min="2" max="10" value="3">
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary px-4">문서 군집화</button>
                    </div>
                </form>
            </div>

            <!-- 텍스트 요약 -->
            <div class="tab-pane fade" id="summarize" role="tabpanel">
                <form id="summarizeForm">
                    <div class="form-group">
                        <label for="summarizeText" class="form-label">텍스트</label>
                        <textarea class="form-control" id="summarizeText" name="text" rows="8" placeholder="요약할 텍스트를 입력하세요" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="sentenceCount" class="form-label">요약 문장 수</label>
                        <input type="number" class="form-control" id="sentenceCount" name="sentenceCount" min="1" max="10" value="3">
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary px-4">텍스트 요약</button>
                    </div>
                </form>
            </div>

            <!-- 주제 분류 -->
            <div class="tab-pane fade" id="topic" role="tabpanel">
                <form id="topicForm">
                    <div class="form-group">
                        <label for="topicText" class="form-label">텍스트</label>
                        <textarea class="form-control" id="topicText" name="text" rows="8" placeholder="주제 분류할 텍스트를 입력하세요" required></textarea>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary px-4">주제 분류</button>
                    </div>
                </form>
            </div>

            <!-- 텍스트 토큰화 -->
            <div class="tab-pane fade" id="tokenize" role="tabpanel">
                <form id="tokenizeForm">
                    <div class="form-group">
                        <label for="tokenizeText" class="form-label">텍스트</label>
                        <textarea class="form-control" id="tokenizeText" name="text" rows="8" placeholder="토큰화할 텍스트를 입력하세요" required></textarea>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary px-4">텍스트 토큰화</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="d-flex justify-content-center mt-4">
            <div id="loadingSpinner" class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div id="resultSection" class="mt-4" style="display: none;">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 id="resultTitle" class="mb-0">분석 결과</h5>
                    <button id="showChartBtn" class="btn btn-sm btn-outline-primary">차트로 보기</button>
                </div>
                <div class="card-body">
                    <div id="resultContent"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    $(document).ready(function() {
        // 공통 유효성 검사 함수
        function validateInput(value, message) {
            if (!value || value.trim() === '') {
                alert(message);
                return false;
            }
            return true;
        }

        // 숫자 입력값 유효성 검사 함수
        function validateNumber(value, min, max, message) {
            const number = parseInt(value, 10);
            if (isNaN(number) || number < min || number > max) {
                alert(message);
                return false;
            }
            return true;
        }

        // XSS 방지용 HTML escape 함수
        function escapeHtml(text) {
            return $('<div>').text(text).html();
        }

        // 공통 Ajax 요청 함수
        function sendRequest({ url, method = 'GET', data, contentType = 'application/x-www-form-urlencoded', onSuccess }) {
            showLoading();
            $.ajax({
                url,
                type: method,
                data: method === 'GET' ? data : JSON.stringify(data),
                contentType: contentType,
                success: function(response) {
                    hideLoading();
                    onSuccess(response);
                },
                error: handleApiError
            });
        }

        // 결과 보여주고 리다이렉트
        function showResultAndRedirect(type, result) {
            $('#resultText').text(result);
            $('#resultSection').show();
            $('#analysisType').val(type);
            $('#analysisResult').val(result);
        }

        // 로딩 인디케이터 표시
        function showLoading() {
            $('#loadingIndicator').show();
        }

        function hideLoading() {
            $('#loadingIndicator').hide();
        }

        // API 에러 처리
        function handleApiError(xhr, status, error) {
            hideLoading();
            console.error('API 호출 에러:', error);
            alert('API 호출 중 오류가 발생했습니다.');
        }

        // 유사도 분석 결과 포맷 함수
        function formatSimilarityResult(data) {
            let resultHtml = '';
            for (const [key, value] of Object.entries(data)) {
                const percentage = (value * 100).toFixed(2);
                resultHtml += `
                <div class="mb-2">
                    <strong>${escapeHtml(key)}:</strong>
                    <div class="progress">
                        <div class="progress-bar" role="progressbar" style="width: ${percentage}%;" aria-valuenow="${percentage}" aria-valuemin="0" aria-valuemax="100">${percentage}%</div>
                    </div>
                </div>
            `;
            }
            return resultHtml;
        }

        // 키워드 추출
        $('#keywordForm').submit(function(event) {
            event.preventDefault();
            const text = $('#text').val();
            if (!validateInput(text, '텍스트를 입력해주세요.')) return;

            sendRequest({
                url: '/api/v1/text-analysis/keywords',
                data: { text },
                onSuccess: function(response) {
                    showResultAndRedirect('keywords', response.data.join(', '));
                }
            });
        });

        // 감정 분석
        $('#sentimentForm').submit(function(event) {
            event.preventDefault();
            const text = $('#text2').val();
            if (!validateInput(text, '텍스트를 입력해주세요.')) return;

            sendRequest({
                url: '/api/v1/text-analysis/sentiment',
                data: { text },
                onSuccess: function(response) {
                    showResultAndRedirect('sentiment', response.data);
                }
            });
        });

        // 유사도 분석
        $('#similarityForm').submit(function(event) {
            event.preventDefault();
            const text1 = $('#text1').val();
            const text2 = $('#text2_2').val();
            if (!validateInput(text1, '첫 번째 텍스트를 입력해주세요.')) return;
            if (!validateInput(text2, '두 번째 텍스트를 입력해주세요.')) return;

            sendRequest({
                url: '/api/v1/text-analysis/similarity',
                method: 'POST',
                data: { text1, text2 },
                contentType: 'application/json',
                onSuccess: function(response) {
                    const formatted = formatSimilarityResult(response.data);
                    $('#resultText').html(formatted);
                    $('#resultSection').show();
                    $('#analysisType').val('similarity');
                    $('#analysisResult').val(response.data);
                }
            });
        });

        // 클러스터링
        $('#clusterForm').submit(function(event) {
            event.preventDefault();
            const documents = $('#documents').val();
            const clusterCount = $('#clusterCount').val();

            if (!validateInput(documents, '문서를 입력해주세요.')) return;
            if (!validateNumber(clusterCount, 1, 20, '클러스터 수는 1~20 사이로 입력해주세요.')) return;

            sendRequest({
                url: '/api/v1/text-analysis/cluster',
                method: 'POST',
                data: { documents: documents.split('\n'), clusterCount },
                contentType: 'application/json',
                onSuccess: function(response) {
                    const clusters = response.data;
                    let resultHtml = '';
                    clusters.forEach((cluster, index) => {
                        resultHtml += `<h5>클러스터 ${index + 1}</h5><ul>`;
                        cluster.forEach(doc => {
                            resultHtml += `<li>${escapeHtml(doc)}</li>`;
                        });
                        resultHtml += '</ul>';
                    });
                    $('#resultText').html(resultHtml);
                    $('#resultSection').show();
                    $('#analysisType').val('cluster');
                    $('#analysisResult').val(JSON.stringify(response.data));
                }
            });
        });

        // 요약
        $('#summaryForm').submit(function(event) {
            event.preventDefault();
            const text = $('#summaryText').val();
            const sentenceCount = $('#sentenceCount').val();

            if (!validateInput(text, '텍스트를 입력해주세요.')) return;
            if (!validateNumber(sentenceCount, 1, 10, '요약 문장 수는 1~10 사이로 입력해주세요.')) return;

            sendRequest({
                url: '/api/v1/text-analysis/summarize',
                method: 'POST',
                data: { text, sentenceCount },
                contentType: 'application/json',
                onSuccess: function(response) {
                    showResultAndRedirect('summary', response.data.join(' '));
                }
            });
        });

        // 주제 분류
        $('#topicForm').submit(function(event) {
            event.preventDefault();
            const text = $('#topicText').val();
            if (!validateInput(text, '텍스트를 입력해주세요.')) return;

            sendRequest({
                url: '/api/v1/text-analysis/topic',
                method: 'POST',
                data: { text },
                contentType: 'application/json',
                onSuccess: function(response) {
                    showResultAndRedirect('topic', response.data);
                }
            });
        });

        // 토큰화
        $('#tokenForm').submit(function(event) {
            event.preventDefault();
            const text = $('#tokenText').val();
            if (!validateInput(text, '텍스트를 입력해주세요.')) return;

            sendRequest({
                url: '/api/v1/text-analysis/tokenize',
                method: 'POST',
                data: { text },
                contentType: 'application/json',
                onSuccess: function(response) {
                    showResultAndRedirect('tokenize', response.data.join(', '));
                }
            });
        });
    });
</script>
</body>
</html>
