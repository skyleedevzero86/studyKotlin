<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>분석 결과 - AI 이미지 분석 스튜디오</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    .result-container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .result-header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
    }
    .result-content {
      padding: 30px;
    }
    .analysis-image {
      max-width: 100%;
      max-height: 400px;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .result-text {
      background: #f8f9fa;
      border-left: 4px solid #007bff;
      padding: 20px;
      border-radius: 0 10px 10px 0;
      line-height: 1.8;
    }
    .copy-btn {
      position: absolute;
      top: 10px;
      right: 10px;
    }
  </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/analyzeMain">
      <i class="fas fa-robot me-2"></i>AI 이미지 분석 스튜디오
    </a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/analyzeMain">
        <i class="fas fa-home me-1"></i>홈
      </a>
      <a class="nav-link" href="/history">
        <i class="fas fa-history me-1"></i>분석 기록
      </a>
    </div>
  </div>
</nav>

<div class="container py-5">
  <div class="result-container">
    <div class="result-header text-center">
      <h1 class="mb-3">
        <i class="fas fa-check-circle me-3"></i>분석 완료!
      </h1>
      <h3 th:text="${result.analysisType}"></h3>
      <p class="mb-0">
        <i class="fas fa-clock me-2"></i>
        <span th:text="${#dates.format(new java.util.Date(result.timestamp), 'yyyy년 MM월 dd일 HH:mm')}"></span>
      </p>
    </div>

    <div class="result-content">
      <div class="row">
        <div class="col-md-5">
          <div class="text-center mb-4">
            <h5 class="mb-3">분석된 이미지</h5>
            <img th:src="${result.imageUrl}" alt="분석 이미지" class="analysis-image">
          </div>
        </div>

        <div class="col-md-7">
          <div class="position-relative">
            <h5 class="mb-3">AI 분석 결과</h5>
            <button class="btn btn-outline-secondary btn-sm copy-btn" onclick="copyResult()" title="결과 복사">
              <i class="fas fa-copy"></i>
            </button>
            <div class="result-text" id="resultText">
              <span th:text="${result.result}" style="white-space: pre-line;"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="row mt-4">
        <div class="col-12 text-center">
          <a href="/analyzeMain" class="btn btn-primary btn-lg me-3">
            <i class="fas fa-plus me-2"></i>새로운 분석하기
          </a>
          <a href="/history" class="btn btn-outline-primary btn-lg me-3">
            <i class="fas fa-list me-2"></i>분석 기록 보기
          </a>
          <button class="btn btn-outline-success btn-lg" onclick="shareResult()">
            <i class="fas fa-share me-2"></i>결과 공유하기
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed top-0 end-0 p-3">
  <div id="copyToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="toast-header">
      <i class="fas fa-check-circle text-success me-2"></i>
      <strong class="me-auto">복사 완료</strong>
      <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
    </div>
    <div class="toast-body">
      분석 결과가 클립보드에 복사되었습니다.
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function copyResult() {
    const resultText = document.getElementById('resultText').innerText;
    navigator.clipboard.writeText(resultText).then(function() {
      const toast = new bootstrap.Toast(document.getElementById('copyToast'));
      toast.show();
    });
  }

  function shareResult() {
    if (navigator.share) {
      navigator.share({
        title: 'AI 이미지 분석 결과',
        text: document.getElementById('resultText').innerText,
        url: window.location.href
      });
    } else {
      copyResult();
    }
  }
</script>
</body>
</html>
