<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분석 기록 - AI 이미지 분석 스튜디오</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .history-card {
            transition: transform 0.2s ease;
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .history-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        .analysis-thumbnail {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
        }
        .analysis-type-badge {
            font-size: 0.85em;
        }
        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 0;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        .result-preview {
            max-height: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
        }
        .stats-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .filter-controls {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/analyzeMain">
            <i class="fas fa-robot me-2"></i>AI 이미지 분석 스튜디오
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/analyzeMain">
                <i class="fas fa-home me-1"></i>홈
            </a>
            <a class="nav-link active" href="/history">
                <i class="fas fa-history me-1"></i>분석 기록
            </a>
            <a class="nav-link" href="/api-test">
                <i class="fas fa-code me-1"></i>API 테스트
            </a>
        </div>
    </div>
</nav>


<section class="page-header">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-8">
                <h1 class="display-5 fw-bold mb-3">
                    <i class="fas fa-history me-3"></i>분석 기록
                </h1>
                <p class="lead mb-0">지금까지 수행한 모든 AI 이미지 분석 결과를 확인하세요</p>
            </div>
            <div class="col-md-4 text-md-end">
                <div class="stats-card d-inline-block">
                    <h3 class="text-primary mb-1" th:text="${#lists.size(analyses)}">0</h3>
                    <small class="text-muted">총 분석 횟수</small>
                </div>
            </div>
        </div>
    </div>
</section>

<div class="container py-5">

    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="fas fa-check-circle me-2"></i>
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>


    <div th:if="${not #lists.isEmpty(analyses)}" class="filter-controls">
        <div class="row align-items-center">
            <div class="col-md-6">
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fas fa-filter"></i>
                    </span>
                    <select class="form-select" id="analysisTypeFilter">
                        <option value="">모든 분석 유형</option>
                        <option value="나이 추정">나이 추정</option>
                        <option value="감정 분석">감정 분석</option>
                        <option value="패션 분석">패션 분석</option>
                        <option value="장면 설명">장면 설명</option>
                        <option value="이야기 생성">이야기 생성</option>
                        <option value="레시피 추천">레시피 추천</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6 text-md-end mt-3 mt-md-0">
                <form th:action="@{/clear-history}" method="post" class="d-inline"
                      onsubmit="return confirm('정말로 모든 분석 기록을 삭제하시겠습니까?')">
                    <button type="submit" class="btn btn-outline-danger">
                        <i class="fas fa-trash me-2"></i>전체 삭제
                    </button>
                </form>
            </div>
        </div>
    </div>


    <div th:if="${#lists.isEmpty(analyses)}" class="empty-state">
        <i class="fas fa-search text-muted"></i>
        <h3>분석 기록이 없습니다</h3>
        <p class="text-muted mb-4">아직 이미지 분석을 수행하지 않았습니다.<br>첫 번째 분석을 시작해보세요!</p>
        <a href="/analyzeMain" class="btn btn-primary btn-lg">
            <i class="fas fa-plus me-2"></i>첫 분석 시작하기
        </a>
    </div>


    <div th:if="${not #lists.isEmpty(analyses)}" class="analysis-history">
        <div th:each="analysis, iterStat : ${analyses}" class="history-card card analysis-item"
             th:data-type="${analysis.analysisType}">
            <div class="card-body">
                <div class="row align-items-center">

                    <div class="col-md-2 text-center">
                        <img th:src="${analysis.imageUrl}" alt="분석 이미지"
                             class="analysis-thumbnail" th:onerror="this.src='/images/fallback.jpg'">
                    </div>


                    <div class="col-md-7">
                        <div class="d-flex align-items-center mb-2">
                            <span class="badge bg-primary analysis-type-badge me-2"
                                  th:text="${analysis.analysisType}"></span>
                            <small class="text-muted">
                                <i class="fas fa-clock me-1"></i>
                                <span th:text="${#dates.format(new java.util.Date(analysis.timestamp), 'yyyy-MM-dd HH:mm')}"></span>
                            </small>
                        </div>
                        <div class="result-preview">
                            <p class="mb-0" th:text="${#strings.abbreviate(analysis.result, 200)}"></p>
                        </div>
                    </div>


                    <div class="col-md-3 text-end">
                        <a th:href="@{/result(id=${analysis.id})}"
                           class="btn btn-outline-primary btn-sm me-2" title="전체 결과 보기">
                            <i class="fas fa-eye"></i>
                        </a>
                        <button class="btn btn-outline-secondary btn-sm me-2"
                                th:data-result="${analysis.result}"
                                onclick="copyToClipboard(this.getAttribute('data-result'))"
                                title="결과 복사">
                            <i class="fas fa-copy"></i>
                        </button>
                        <button class="btn btn-outline-success btn-sm"
                                th:data-id="${analysis.id}"
                                onclick="shareAnalysis(this.getAttribute('data-id'))"
                                title="공유하기">
                            <i class="fas fa-share"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div th:if="${#lists.size(analyses) >= 10}" class="text-center mt-4">
        <button class="btn btn-outline-primary btn-lg" onclick="loadMore()">
            <i class="fas fa-chevron-down me-2"></i>더 보기
        </button>
    </div>
</div>


<div class="toast-container position-fixed top-0 end-0 p-3">
    <div id="copyToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header">
            <i class="fas fa-check-circle text-success me-2"></i>
            <strong class="me-auto">복사 완료</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body">
            분석 결과가 클립보드에 복사되었습니다.
        </div>
    </div>
</div>


<footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center">
        <p class="mb-0">
            <i class="fas fa-code me-2"></i>
            sleekydz86@copyright
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Filter functionality
    document.addEventListener('DOMContentLoaded', function() {
        const filterElement = document.getElementById('analysisTypeFilter');
        if (filterElement) {
            filterElement.addEventListener('change', function() {
                const filterValue = this.value;
                const analysisItems = document.querySelectorAll('.analysis-item');

                analysisItems.forEach(item => {
                    const analysisType = item.getAttribute('data-type');
                    if (filterValue === '' || analysisType === filterValue) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });
        }
    });

    // Copy to clipboard function
    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(function() {
            const toast = new bootstrap.Toast(document.getElementById('copyToast'));
            toast.show();
        }).catch(function(err) {
            console.error('복사 실패:', err);
            alert('클립보드 복사에 실패했습니다.');
        });
    }

    // Share analysis function
    function shareAnalysis(analysisId) {
        const shareUrl = window.location.origin + '/result?id=' + analysisId;

        if (navigator.share) {
            navigator.share({
                title: 'AI 이미지 분석 결과',
                text: 'AI가 분석한 이미지 결과를 확인해보세요!',
                url: shareUrl
            }).catch(err => console.log('공유 실패:', err));
        } else {
            // Fallback: copy URL to clipboard
            navigator.clipboard.writeText(shareUrl).then(function() {
                alert('분석 결과 링크가 클립보드에 복사되었습니다!');
            }).catch(function(err) {
                console.error('URL 복사 실패:', err);
                prompt('이 링크를 복사하세요:', shareUrl);
            });
        }
    }

    // Load more function (for future implementation)
    function loadMore() {
        // TODO: Implement pagination
        console.log('Load more functionality to be implemented');
    }

    // Auto-hide alerts after 5 seconds
    setTimeout(function() {
        const alerts = document.querySelectorAll('.alert');
        alerts.forEach(alert => {
            const bsAlert = new bootstrap.Alert(alert);
            bsAlert.close();
        });
    }, 5000);
</script>
</body>
</html>
